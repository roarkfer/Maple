name: Build and deploy Maple

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Maple
        run: npm run build

      - name: Add offline PWA files
        run: |
          cp sw.js reset.html manifest.webmanifest robots.txt dist/
          cp icon-192.png icon-512.png favicon.png apple-touch-icon.png dist/

      - name: Verify deployment files
        run: |
          test -s dist/index.html
          test -s dist/export.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/icon-192.png
          test -s dist/icon-512.png
          test -d dist/assets

      - name: Upload Maple
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Maple
        id: deployment
        uses: actions/deploy-pages@v4
