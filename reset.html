<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Actualizar Maple v8</title></head>
<body><p>Actualizando Maple…</p><script>
(async () => {
  if ("serviceWorker" in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const reg of regs) await reg.unregister();
  }
  if ("caches" in window) {
    const names = await caches.keys();
    for (const name of names) if (name.startsWith("maple-")) await caches.delete(name);
  }
  location.replace("./?v=8-reset-" + Date.now());
})();
</script></body></html>
